name: "Deploy: Android Release APK"

# Builds a signed release APK and attaches it to a GitHub Release.
# Trigger: push a version tag (v1.0.0, ...) or run manually.
#
# Secrets come from one of two sources, checked in this order:
#   1. 1Password — set the repo secret OP_SERVICE_ACCOUNT_TOKEN and every value below is resolved from
#      op:// references (vault Nexion, item "couple-sync"). See docs/deployment/releases.md.
#   2. GitHub repo secrets (fallback, used when OP_SERVICE_ACCOUNT_TOKEN is unset) — same behaviour as before:
#        ANDROID_KEYSTORE_BASE64   base64 of the release keystore (1Password: Nexion → "couple-sync", field keystore_base64)
#        ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD
#        GOOGLE_SERVICES_JSON      base64 of the REAL google-services.json (download after enabling Google sign-in). If unset, a
#                                  placeholder is used and Google Sign-In will NOT work — the build still succeeds so CI stays green.
#        GOOGLE_WEB_CLIENT_ID      Web OAuth client id (from the Firebase Google provider). Embedded into the app at build time.
# Non-secret:
#   API_BASE_URL defaults to https://couple-sync.yashiel.dev

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# A signed release build must never be interrupted mid-flight, so overlapping runs serialize
# rather than cancel (see github-actions-conventions §6: serialize deploys/publishes).
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_BASE_URL: https://couple-sync.yashiel.dev
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
      # Job-level so the "Load secrets" step can gate on it — the `secrets` context is not allowed in `if`.
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
      # versionCode must strictly increase; run_number is monotonic. Read by app.config.ts at prebuild.
      ANDROID_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      # Marketing version (app.config.ts `version`) from the release tag: v1.0.1 → 1.0.1. Only on a
      # tag; a manual/branch run leaves it unset and app.config falls back to its default.
      - name: Resolve app version from tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      # When OP_SERVICE_ACCOUNT_TOKEN is set, resolve every secret from 1Password and export it into
      # the job environment. When it is unset this step is skipped and the consuming steps below fall
      # back to the ${{ secrets.* }} inputs, so existing repos keep working unchanged.
      - name: Load secrets from 1Password
        if: ${{ env.OP_SERVICE_ACCOUNT_TOKEN != '' }}
        uses: 1Password/load-secrets-action@e544b780808654ba8ceba5fb2fe2897103d92ff4 # v5.0.0
        with:
          export-env: true
        env:
          ANDROID_KEYSTORE_BASE64: op://Nexion/couple-sync/keystore_base64
          ANDROID_KEYSTORE_PASSWORD: op://Nexion/couple-sync/keystore_password
          ANDROID_KEY_ALIAS: op://Nexion/couple-sync/key_alias
          ANDROID_KEY_PASSWORD: op://Nexion/couple-sync/key_password
          GOOGLE_SERVICES_JSON: op://Nexion/couple-sync/google_services_json_b64
          GOOGLE_WEB_CLIENT_ID: op://Nexion/couple-sync/google_web_client_id
          # Firebase App Distribution (Android's TestFlight): service account + the Android app id.
          FIREBASE_SERVICE_ACCOUNT_JSON: op://Nexion/couple-sync/firebase_service_account_json
          ANDROID_APP_ID: op://Nexion/couple-sync/android_app_id

      - name: Install dependencies
        run: npm ci

      - name: Provision google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ env.GOOGLE_SERVICES_JSON || secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > google-services.json
            echo "Using real google-services.json from secret."
          else
            cp google-services.placeholder.json google-services.json
            echo "::warning::GOOGLE_SERVICES_JSON is unset — built with the placeholder. Google Sign-In will not work in this APK."
          fi

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ env.ANDROID_KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Expo prebuild (generate android/)
        run: npx expo prebuild -p android --no-install

      - name: Build signed release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ env.ANDROID_KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ env.ANDROID_KEY_ALIAS || secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ env.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Stage APK
        id: apk
        run: |
          SRC=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          DEST="couple-sync-${{ github.ref_name }}.apk"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: couple-sync-apk
          path: ${{ steps.apk.outputs.path }}

      # Android's TestFlight equivalent: push the signed APK to Firebase App Distribution so testers
      # get an auto-notified install (group "testers"). Uses the Firebase Admin service account (needs
      # the "Firebase App Distribution Admin" IAM role). Skipped when the creds aren't resolved (no OP
      # token) — the APK is still on the GitHub Release below.
      - name: Distribute to Firebase App Distribution
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT_JSON != '' && env.ANDROID_APP_ID != '' }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/fb-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/fb-sa.json"
          npx --yes firebase-tools appdistribution:distribute "${{ steps.apk.outputs.path }}" \
            --app "$ANDROID_APP_ID" \
            --groups "group-a" \
            --release-notes "${{ github.ref_name }} (build ${{ github.run_number }})"

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
