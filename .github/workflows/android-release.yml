name: Android Release

# Builds a signed release APK and attaches it to a GitHub Release.
# Trigger: push a version tag (v1.0.0, ...) or run manually.
#
# Required repo secrets:
#   ANDROID_KEYSTORE_BASE64   base64 of the release keystore (in 1Password: Nexion → "couple-sync Android release keystore")
#   ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD
#   GOOGLE_SERVICES_JSON      base64 of the REAL google-services.json (download after enabling Google sign-in). If unset, a
#                             placeholder is used and Google Sign-In will NOT work — the build still succeeds so CI stays green.
#   GOOGLE_WEB_CLIENT_ID      Web OAuth client id (from the Firebase Google provider). Embedded into the app at build time.
# Non-secret:
#   API_BASE_URL defaults to https://couple-sync.yashiel.dev

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      API_BASE_URL: https://couple-sync.yashiel.dev
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Provision google-services.json
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > google-services.json
            echo "Using real google-services.json from secret."
          else
            cp google-services.placeholder.json google-services.json
            echo "::warning::GOOGLE_SERVICES_JSON secret is unset — built with the placeholder. Google Sign-In will not work in this APK."
          fi

      - name: Decode release keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Expo prebuild (generate android/)
        run: npx expo prebuild -p android --no-install

      - name: Build signed release APK
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}"

      - name: Stage APK
        id: apk
        run: |
          SRC=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          DEST="couple-sync-${{ github.ref_name }}.apk"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: couple-sync-apk
          path: ${{ steps.apk.outputs.path }}

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
