name: Rebase PRs

# Automatically rebases open PRs when main advances, and rebases a single PR
# on demand when someone comments "/rebase" on it.

on:
  push:
    branches: [main]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write

jobs:
  # ── Triggered by push to main ─────────────────────────────────────────────
  rebase-all:
    name: Rebase out-of-date PRs
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Rebase each open PR that is behind main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --all --prune

          gh pr list --base main --state open \
            --json number,headRefName \
            --jq '.[] | "\(.number) \(.headRefName)"' | \
          while read -r pr_number branch; do
            # Skip branches already up to date with main
            if git merge-base --is-ancestor origin/main "origin/$branch" 2>/dev/null; then
              echo "PR #$pr_number ($branch): already up to date — skipping"
              continue
            fi

            echo "PR #$pr_number ($branch): rebasing..."
            git checkout -B "$branch" "origin/$branch"

            if git rebase origin/main; then
              git push --force-with-lease origin "$branch"
              echo "PR #$pr_number: rebased OK"
            else
              git rebase --abort
              gh pr comment "$pr_number" \
                --body "⚠️ Auto-rebase onto \`main\` failed due to merge conflicts. Please rebase manually."
              echo "PR #$pr_number: conflict — commented on PR"
            fi
          done

  # ── Triggered by /rebase comment on a PR ─────────────────────────────────
  rebase-one:
    name: Rebase on /rebase comment
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '/rebase')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Rebase this PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          git fetch --all --prune
          branch=$(gh pr view "$PR_NUMBER" --json headRefName --jq '.headRefName')

          git checkout -B "$branch" "origin/$branch"

          if git rebase origin/main; then
            git push --force-with-lease origin "$branch"
            gh pr comment "$PR_NUMBER" \
              --body "✅ Branch rebased onto \`main\` successfully."
          else
            git rebase --abort
            gh pr comment "$PR_NUMBER" \
              --body "⚠️ Auto-rebase onto \`main\` failed due to merge conflicts. Please rebase manually."
          fi
