name: "Deploy: iOS TestFlight"

# Builds a signed iOS .ipa on the paid Apple team and uploads it to TestFlight (App Store Connect).
# Testers install via the TestFlight app — a raw .ipa cannot be sideloaded, so there is no GitHub
# Release attach here. Trigger: push a version tag (v1.0.0, ...) or run manually.
#
# Secrets come from 1Password via load-secrets-action: account-wide Apple creds from Agents/
# apple-developer, app-specific config from Nexion/couple-sync. The only GitHub repo secret required
# is OP_SERVICE_ACCOUNT_TOKEN (read on both vaults) — everything else is an op:// reference resolved
# at runtime. See docs/deployment/releases.md for the field list and portal setup.
#
# The build number is the workflow run number, so every upload is unique (App Store Connect rejects a
# re-used build number). This build keeps the real push entitlement: CS_NO_PUSH is intentionally NOT
# set (that flag only exists for a free personal team, which cannot carry aps-environment).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# A signed release build must never be interrupted mid-flight, so overlapping runs serialize rather
# than cancel (see github-actions-conventions §6: serialize deploys/publishes).
concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Needs Xcode >= 26.4: firebase-ios-sdk wants Xcode 16+, and a dependency's Swift package requires
    # Swift tools 6.2; expo-modules-jsi only compiles cleanly under Xcode 26.4+ (26.3 hits a Swift 6.2
    # type-inference bug — expo/expo#47957). macos-26 ships a 26.4+ toolchain.
    runs-on: macos-26
    timeout-minutes: 45
    env:
      API_BASE_URL: https://couple-sync.yashiel.dev
      # Manual App Store signing (automatic/cloud signing failed: "No signing certificate iOS
      # Distribution found"). A manually-managed Distribution cert + App Store profile are imported
      # from 1Password at build time; see the "Set up code signing" step below.
      EXPORT_METHOD: app-store-connect
      # Unique per run → a fresh CFBundleVersion App Store Connect will accept. Read by app.config.ts.
      IOS_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      # Marketing version (app.config.ts `version`) from the release tag: v1.0.1 → 1.0.1. Only on a
      # tag; a manual/branch run leaves it unset and app.config falls back to its default.
      - name: Resolve app version from tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi

      # A dependency's Swift package needs Swift tools 6.2; the runner's default Xcode (16.4) ships
      # Swift 6.1. Select the newest stable Xcode (26.x → Swift 6.2) so package resolution succeeds.
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Load secrets from 1Password
        uses: 1Password/load-secrets-action@e544b780808654ba8ceba5fb2fe2897103d92ff4 # v5.0.0
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          # App-specific → Nexion/couple-sync.
          GOOGLE_SERVICE_INFO_PLIST_B64: op://Nexion/couple-sync/google_services_info_plist_b64
          GOOGLE_WEB_CLIENT_ID: op://Nexion/couple-sync/google_web_client_id
          # Manual-signing profile is per-app (bound to dev.yashiel.couplesync) → Nexion/couple-sync.
          IOS_APPSTORE_PROFILE_BASE64: op://Nexion/couple-sync/ios_appstore_profile_base64
          IOS_APPSTORE_PROFILE_NAME: op://Nexion/couple-sync/ios_appstore_profile_name
          # Account-wide Apple creds (shared by every iOS app) → Agents/apple-developer.
          ASC_API_KEY_ID: op://Agents/apple-developer/asc_api_key_id
          ASC_ISSUER_ID: op://Agents/apple-developer/asc_issuer_id
          ASC_API_KEY_P8_BASE64: op://Agents/apple-developer/asc_api_key_p8_base64
          APPLE_TEAM_ID: op://Agents/apple-developer/apple_team_id
          # Manual signing: the iOS Distribution cert (+ its p12 password) is reusable across apps.
          IOS_DIST_CERT_P12_BASE64: op://Agents/apple-developer/ios_dist_cert_p12_base64
          IOS_DIST_CERT_PASSWORD: op://Agents/apple-developer/ios_dist_cert_password

      - name: Provision GoogleService-Info.plist
        run: echo "$GOOGLE_SERVICE_INFO_PLIST_B64" | openssl base64 -d -A > GoogleService-Info.plist

      - name: Provision App Store Connect API key
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          echo "$ASC_API_KEY_P8_BASE64" | openssl base64 -d -A > "$RUNNER_TEMP/asc/AuthKey_${ASC_API_KEY_ID}.p8"

      - name: Expo prebuild (generate ios/)
        run: npx expo prebuild -p ios --no-install

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Set up code signing (manual)
        # Import the Distribution cert into a throwaway keychain and drop the App Store profile where
        # Xcode looks for it. The keychain password is ephemeral (never leaves the runner); the p12
        # password is the 1Password-held one. set-key-partition-list stops codesign's UI prompt, and
        # putting the keychain on the search list lets xcodebuild find the identity.
        env:
          KEYCHAIN_PATH: ${{ runner.temp }}/app-signing.keychain-db
        run: |
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN_PATH"

          echo "$IOS_DIST_CERT_P12_BASE64" | openssl base64 -d -A > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -P "$IOS_DIST_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PW" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo "$IOS_APPSTORE_PROFILE_BASE64" | openssl base64 -d -A \
            > "$PROFILE_DIR/couplesync-appstore.mobileprovision"

      - name: Write ExportOptions.plist
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>${EXPORT_METHOD}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>dev.yashiel.couplesync</key>
              <string>${IOS_APPSTORE_PROFILE_NAME}</string>
            </dict>
            <key>destination</key>
            <string>export</string>
            <key>stripSwiftSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST

      - name: Build signed archive
        # Manual signing is baked into ONLY the app target by plugins/withIosManualSigning.js (scoped
        # by bundle id) during prebuild. Passing signing settings on the command line here would apply
        # them to every Pod target too, and Pods reject a provisioning profile. So no signing flags —
        # and no -allowProvisioningUpdates/ASC auth key (that is the cloud path that failed).
        run: |
          xcodebuild \
            -workspace ios/CoupleSync.xcworkspace \
            -scheme CoupleSync \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/CoupleSync.xcarchive" \
            archive

      - name: Export signed .ipa
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/CoupleSync.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - name: Stage IPA
        id: ipa
        run: |
          SRC=$(find "$RUNNER_TEMP/export" -name '*.ipa' | head -1)
          DEST="couple-sync-${{ github.ref_name }}.ipa"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: couple-sync-ipa
          path: ${{ steps.ipa.outputs.path }}

      - name: Upload to TestFlight
        # altool finds the key by API_PRIVATE_KEYS_DIR + the --apiKey id (AuthKey_<id>.p8). This
        # uploads the build to App Store Connect; it appears in TestFlight after Apple finishes
        # processing (a few minutes). Internal testers get it immediately; external testers need a
        # one-time beta review. `--upload-package` is not used — plain --upload-app is correct for IPAs.
        env:
          API_PRIVATE_KEYS_DIR: ${{ runner.temp }}/asc
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file "${{ steps.ipa.outputs.path }}" \
            --apiKey "$ASC_API_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"
