name: "CI: PR Agent"
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]
permissions:
  issues: write
  pull-requests: write
  contents: read

# Scope per-PR so a superseded review (new push / new comment on the same PR) cancels, while
# reviews on different PRs never contend. Keyed off pull_request or issue_comment payloads.
concurrency:
  group: pr-agent-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    uses: skynergroup/.github/.github/workflows/pr-agent.yml@main
    secrets:
      KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
