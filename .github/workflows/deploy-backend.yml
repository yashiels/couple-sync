# Deploy Backend Workflow
# Triggers on push to main when Cloud Functions or Firestore config files change.
# Deploys Firebase Cloud Functions and Firestore rules/indexes.
#
# Required secrets:
#   GCP_SA_KEY — JSON key for the github-deployer service account in
#                nexion-ai-prod (see 1Password: Nexion-Deck / couple-sync/firebase/github-deployer-sa).

name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - 'firestore.indexes.json'
  workflow_dispatch:  # manual trigger from Actions tab; pick any branch to deploy

jobs:
  deploy:
    name: Deploy Functions & Firestore
    runs-on: [self-hosted, Linux, X64, astra]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install function dependencies
        working-directory: functions
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools --force

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy Functions and Firestore rules
        run: firebase deploy --only functions,firestore --project nexion-ai-prod --non-interactive
