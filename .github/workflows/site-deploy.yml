name: "Deploy: Site (Cloudflare Pages)"

# Deploys site/public to Cloudflare Pages and binds the API proxy (site/functions) to the Atlas
# tunnel. Push-to-main / manual only — never pull_request — so a fork can never publish.
#
# Secret: CF_PAGES_API_TOKEN — a Cloudflare API token scoped to Cloudflare Pages:Edit on THIS
# project only. It is NOT the broad account token (api.cloudflare.apex) from 1Password; that one
# edits DNS and tunnels and must not sit on a public repo. Create the scoped token under the CF
# account that owns the yashiel.dev zone.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/site-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

# Serialize publishes; never cancel mid-deploy (same convention as the backend image publish).
concurrency:
  group: deploy-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 10.26.0

      - name: Install site deps
        working-directory: site
        run: pnpm install --frozen-lockfile

      - name: Deploy to Cloudflare Pages
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PAGES_API_TOKEN }}
        # The tunnel hostname the API proxy forwards to. A build-time value, not a secret.
        run: pnpm exec wrangler pages deploy public --project-name couple-sync
