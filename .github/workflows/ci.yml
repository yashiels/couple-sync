name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:  # allow manual trigger (e.g. to run iOS tests on any branch)

# Cancel older in-progress runs of the same ref when a new one starts.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Future-proof: force JS actions to Node 24 (Node 20 forced switch on 2026-06-02)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  analyze:
    name: Analyze
    runs-on: [self-hosted, Linux, X64, astra]
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Fix Flutter git ownership
        run: git config --global --add safe.directory "$(dirname "$(dirname "$(which flutter)")")"
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos

  test:
    name: Test
    runs-on: [self-hosted, Linux, X64, astra]
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Fix Flutter git ownership
        run: git config --global --add safe.directory "$(dirname "$(dirname "$(which flutter)")")"
      - run: flutter pub get
      - run: flutter test

  functions-lint-test:
    name: Functions Lint & Test
    runs-on: [self-hosted, Linux, X64, astra]
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run lint
      - run: npm test

  integration-test:
    name: Integration Test (E2E)
    runs-on: [self-hosted, Linux, X64, astra]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Cache Firebase Emulators
        uses: actions/cache@v5
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Install function dependencies
        run: cd functions && npm ci
      - name: Run E2E tests against Firebase Emulator
        run: bash scripts/run-e2e-tests.sh
      - name: Stop emulators
        if: always()
        run: pkill -f "firebase" || true

  build:
    name: Build
    runs-on: [self-hosted, Linux, X64, astra, android]
    needs: [analyze, test, functions-lint-test]
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Fix Flutter git ownership
        run: git config --global --add safe.directory "$(dirname "$(dirname "$(which flutter)")")"
      - run: flutter pub get
      - run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  ui-test-android:
    name: UI Test (Maestro - Android)
    runs-on: [self-hosted, Linux, X64, astra, android]
    needs: [build]
    env:
      AVD_NAME: ci-avd
      SYSTEM_IMAGE: system-images;android-33;google_apis;x86_64
    steps:
      - uses: actions/checkout@v6

      - name: Download APK
        uses: actions/download-artifact@v8
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Set up Android SDK PATH
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          ls -la "$ANDROID_HOME" || true
          SDKMGR=$(find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | head -1)
          if [ -z "$SDKMGR" ]; then
            echo "::error::sdkmanager not found anywhere under $ANDROID_HOME"
            exit 1
          fi
          echo "Found sdkmanager at: $SDKMGR"
          echo "$(dirname "$SDKMGR")" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/emulator" >> $GITHUB_PATH

      - name: Install system image
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          # emulator and platform-tools are pre-installed in compscidr image; only install the system image
          sdkmanager --install "$SYSTEM_IMAGE"

      - name: Install emulator runtime libs
        run: |
          # Android emulator v36 needs these shared libs even with -no-window.
          # Without them the emulator segfaults at "Could not open libX11-xcb.so.1".
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libx11-6 libx11-xcb1 libxcb1 libxcomposite1 libxcursor1 \
            libxi6 libxtst6 libxdamage1 libxrandr2 libxfixes3 \
            libnss3 libasound2t64 libpulse0 libgl1 libglvnd0 libdrm2

      - name: Create AVD (idempotent)
        run: |
          if [ ! -f "$HOME/.android/avd/$AVD_NAME.ini" ]; then
            echo "Creating AVD $AVD_NAME"
            echo "no" | avdmanager create avd -n "$AVD_NAME" -k "$SYSTEM_IMAGE" --device "pixel_5" --force
          else
            echo "AVD $AVD_NAME already exists, reusing"
          fi

      - name: Start emulator
        run: |
          # Default snapshot behavior: load if exists, save on graceful shutdown.
          # First run is a cold boot (~2-3 min); subsequent runs load the saved
          # snapshot and boot in ~30s. -no-metrics skips Google telemetry.
          # -memory 3072 / -cores 4 give enough headroom that Android's System UI
          # watchdog doesn't ANR during dexopt on first launch.
          nohup "$ANDROID_SDK_ROOT/emulator/emulator" @$AVD_NAME \
            -no-boot-anim -no-window -no-audio -no-metrics \
            -gpu swiftshader_indirect -memory 3072 -cores 4 \
            >/tmp/emulator.log 2>&1 &
          echo $! > /tmp/emulator.pid
          adb start-server
          timeout 300 bash -c \
            'until adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r" | grep -q 1; do sleep 3; done'
          adb shell input keyevent 82  # unlock screen
          # Wait for package manager + zygote to finish warmup.
          # Without this, first-install dexopt can trip "System UI isn't responding" ANR.
          timeout 60 adb shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 1; done' || true
          sleep 15

      - name: Install APK
        run: |
          adb install -r build/app/outputs/flutter-apk/app-debug.apk
          # Force AOT compilation so first launch doesn't JIT under load.
          adb shell cmd package compile -f -m speed com.skynergroup.couple_sync || true

      - name: Run Maestro UI tests
        run: maestro test .maestro/ -e APP_ID=com.skynergroup.couple_sync

      - name: Upload Maestro test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-report
          path: |
            ~/.maestro/tests/**
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop emulator
        if: always()
        run: |
          # adb emu kill triggers graceful shutdown — emulator saves snapshot for next run.
          adb emu kill 2>/dev/null || true
          # Wait briefly for snapshot save to complete before forcing kill.
          sleep 8
          [ -f /tmp/emulator.pid ] && kill "$(cat /tmp/emulator.pid)" 2>/dev/null || true

      - name: Nuke snapshot on failure
        if: failure()
        run: |
          # If this run failed, the saved snapshot may have captured a broken state
          # (e.g. an ANR dialog). Clear it so the next run cold-boots fresh.
          rm -rf "$HOME/.android/avd/$AVD_NAME.avd/snapshots/" 2>/dev/null || true
          echo "Cleared snapshots for $AVD_NAME"

      - name: Emulator log (on failure)
        if: failure()
        run: tail -100 /tmp/emulator.log || true

  # iOS UI tests are intentionally NOT run in CI.
  # Run locally on a simulator: maestro test .maestro/ -e APP_ID=com.skynergroup.coupleSync
