name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:  # allow manual trigger (e.g. to run iOS tests on any branch)

jobs:
  analyze:
    name: Analyze
    runs-on: [self-hosted, Linux, X64, astra]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Fix Flutter git ownership
        run: git config --global --add safe.directory "$(dirname "$(dirname "$(which flutter)")")"
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos

  test:
    name: Test
    runs-on: [self-hosted, Linux, X64, astra]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Fix Flutter git ownership
        run: git config --global --add safe.directory "$(dirname "$(dirname "$(which flutter)")")"
      - run: flutter pub get
      - run: flutter test

  functions-lint-test:
    name: Functions Lint & Test
    runs-on: [self-hosted, Linux, X64, astra]
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run lint
      - run: npm test

  integration-test:
    name: Integration Test (E2E)
    runs-on: [self-hosted, Linux, X64, astra]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Cache Firebase Emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Install function dependencies
        run: cd functions && npm ci
      - name: Run E2E tests against Firebase Emulator
        run: bash scripts/run-e2e-tests.sh
      - name: Stop emulators
        if: always()
        run: pkill -f "firebase" || true

  build:
    name: Build
    runs-on: [self-hosted, Linux, X64, astra, android]
    needs: [analyze, test, functions-lint-test]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Fix Flutter git ownership
        run: git config --global --add safe.directory "$(dirname "$(dirname "$(which flutter)")")"
      - run: flutter pub get
      - run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  ui-test-android:
    name: UI Test (Maestro - Android)
    runs-on: [self-hosted, Linux, X64, astra, android]
    needs: [build]
    env:
      AVD_NAME: ci-avd
      SYSTEM_IMAGE: system-images;android-33;google_apis;x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Install emulator & system image
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "emulator" "platform-tools" "$SYSTEM_IMAGE"

      - name: Create AVD (idempotent)
        run: |
          if ! avdmanager list avd | grep -q "^    Name: $AVD_NAME$"; then
            echo "no" | avdmanager create avd -n "$AVD_NAME" -k "$SYSTEM_IMAGE" --device "pixel_5" --force
          fi

      - name: Start emulator
        run: |
          nohup "$ANDROID_SDK_ROOT/emulator/emulator" @$AVD_NAME \
            -no-boot-anim -no-window -no-audio -no-snapshot \
            -gpu swiftshader_indirect -memory 2048 \
            >/tmp/emulator.log 2>&1 &
          echo $! > /tmp/emulator.pid
          adb start-server
          timeout 240 bash -c \
            'until adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r" | grep -q 1; do sleep 3; done'
          adb shell input keyevent 82  # unlock screen

      - name: Install APK
        run: adb install -r build/app/outputs/flutter-apk/app-debug.apk

      - name: Run Maestro UI tests
        run: maestro test .maestro/ -e APP_ID=com.skynergroup.couple_sync

      - name: Stop emulator
        if: always()
        run: |
          adb emu kill 2>/dev/null || true
          [ -f /tmp/emulator.pid ] && kill "$(cat /tmp/emulator.pid)" 2>/dev/null || true

      - name: Emulator log (on failure)
        if: failure()
        run: tail -100 /tmp/emulator.log || true

  # iOS UI tests are intentionally NOT run in CI.
  # Run locally on a simulator: maestro test .maestro/ -e APP_ID=com.skynergroup.coupleSync
