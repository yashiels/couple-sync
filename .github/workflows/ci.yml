name: "CI: PR Checks"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:  # allow manual trigger

# Cancel older in-progress runs of the same ref when a new one starts.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  # Future-proof: force JS actions to Node 24 (Node 20 forced switch on 2026-06-02)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# CI runs static analysis only. Tests (flutter test, backend vitest) and the
# build / Maestro UI-test pipeline were removed — they relied on self-hosted
# runners (android-label) that aren't provisioned. Run tests locally:
#   flutter test  |  cd backend && pnpm test
# Re-add cloud-runner test jobs when ready (ubuntu-latest + subosito/flutter-action / pnpm).
jobs:
  analyze:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Fix Flutter git ownership
        run: git config --global --add safe.directory "$(dirname "$(dirname "$(which flutter)")")"
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
