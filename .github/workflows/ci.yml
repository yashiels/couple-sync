name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:  # allow manual trigger (e.g. to run iOS tests on any branch)

jobs:
  analyze:
    name: Analyze
    runs-on: [self-hosted, Linux, X64, astra]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Fix Flutter git ownership
        run: git config --global --add safe.directory "$(dirname "$(dirname "$(which flutter)")")"
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos

  test:
    name: Test
    runs-on: [self-hosted, Linux, X64, astra]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Fix Flutter git ownership
        run: git config --global --add safe.directory "$(dirname "$(dirname "$(which flutter)")")"
      - run: flutter pub get
      - run: flutter test

  functions-lint-test:
    name: Functions Lint & Test
    runs-on: [self-hosted, Linux, X64, astra]
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run lint
      - run: npm test

  integration-test:
    name: Integration Test (E2E)
    runs-on: [self-hosted, Linux, X64, astra]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Cache Firebase Emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Install function dependencies
        run: cd functions && npm ci
      - name: Run E2E tests against Firebase Emulator
        run: bash scripts/run-e2e-tests.sh
      - name: Stop emulators
        if: always()
        run: pkill -f "firebase" || true

  build:
    name: Build
    runs-on: [self-hosted, Linux, X64, astra, android]
    needs: [analyze, test, functions-lint-test]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Fix Flutter git ownership
        run: git config --global --add safe.directory "$(dirname "$(dirname "$(which flutter)")")"
      - run: flutter pub get
      - run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  ui-test-android:
    name: UI Test (Maestro - Android)
    runs-on: [self-hosted, Linux, X64, astra, android]
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/
      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH
      - name: Connect to Android emulator container
        run: |
          adb connect android-emulator:5555 || adb connect host.docker.internal:5555 || true
          adb wait-for-device
          adb devices
      - name: Wait for emulator boot
        run: |
          for i in $(seq 1 60); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              echo "Emulator booted"
              break
            fi
            sleep 2
          done
      - name: Install APK
        run: adb install -r build/app/outputs/flutter-apk/app-debug.apk
      - name: Run Maestro UI tests
        run: ~/.maestro/bin/maestro test .maestro/ -e APP_ID=com.skynergroup.couple_sync

  ui-test-ios:
    name: UI Test (Maestro - iOS)
    # Only run iOS tests on push to main, release tags, or when explicitly triggered.
    # This avoids running on every PR since macOS runners are slow and the apex
    # self-hosted Mac gets heavy wear. For PR validation, Android Maestro tests
    # + Linux tests are sufficient.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    # Use GitHub-hosted macOS runner to avoid overworking the apex Mac mini.
    # On GitHub Teams: macOS minutes count 10x against the 3000/mo quota.
    # To switch back to apex: runs-on: [self-hosted, macOS, apex]
    runs-on: macos-14
    needs: [analyze, test]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH
      - run: flutter pub get
      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install
      - name: Boot iOS simulator
        run: |
          xcrun simctl boot "iPhone 15" || xcrun simctl boot "iPhone 15 Pro" || true
          xcrun simctl list devices booted
      - name: Build iOS for simulator
        run: flutter build ios --simulator --debug
      - name: Install app on simulator
        run: |
          xcrun simctl install booted build/ios/iphonesimulator/Runner.app
      - name: Run Maestro UI tests
        run: ~/.maestro/bin/maestro test .maestro/ -e APP_ID=com.skynergroup.coupleSync
      - name: Shutdown simulator
        if: always()
        run: xcrun simctl shutdown all || true
