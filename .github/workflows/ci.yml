name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  analyze:
    name: Analyze
    runs-on: [self-hosted, Linux, X64, astra]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Fix Flutter git ownership
        run: git config --global --add safe.directory "$(dirname "$(dirname "$(which flutter)")")"
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos

  test:
    name: Test
    runs-on: [self-hosted, Linux, X64, astra]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Fix Flutter git ownership
        run: git config --global --add safe.directory "$(dirname "$(dirname "$(which flutter)")")"
      - run: flutter pub get
      - run: flutter test

  functions-lint-test:
    name: Functions Lint & Test
    runs-on: [self-hosted, Linux, X64, astra]
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run lint
      - run: npm test

  integration-test:
    name: Integration Test (E2E)
    runs-on: [self-hosted, Linux, X64, astra]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Install function dependencies
        run: cd functions && npm ci
      - name: Run E2E tests against Firebase Emulator
        run: bash scripts/run-e2e-tests.sh
      - name: Stop emulators
        if: always()
        run: pkill -f "firebase" || true

  build:
    name: Build
    runs-on: [self-hosted, Linux, X64, astra, android]
    needs: [analyze, test, functions-lint-test]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Fix Flutter git ownership
        run: git config --global --add safe.directory "$(dirname "$(dirname "$(which flutter)")")"
      - run: flutter pub get
      - run: flutter build apk --debug
