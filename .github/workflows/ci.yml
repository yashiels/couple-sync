name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  analyze:
    name: Analyze
    runs-on: [self-hosted, Linux, X64, astra]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Fix Flutter git ownership
        run: git config --global --add safe.directory "$(dirname "$(dirname "$(which flutter)")")"
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos

  test:
    name: Test
    runs-on: [self-hosted, Linux, X64, astra]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Fix Flutter git ownership
        run: git config --global --add safe.directory "$(dirname "$(dirname "$(which flutter)")")"
      - run: flutter pub get
      - run: flutter test

  functions-lint-test:
    name: Functions Lint & Test
    runs-on: [self-hosted, Linux, X64, astra]
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run lint
      - run: npm test

  integration-test:
    name: Integration Test (E2E)
    runs-on: [self-hosted, Linux, X64, astra]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Install function dependencies
        run: cd functions && npm ci
      - name: Run E2E tests against Firebase Emulator
        run: bash scripts/run-e2e-tests.sh
      - name: Stop emulators
        if: always()
        run: pkill -f "firebase" || true

  build:
    name: Build
    runs-on: [self-hosted, Linux, X64, astra, android]
    needs: [analyze, test, functions-lint-test]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Fix Flutter git ownership
        run: git config --global --add safe.directory "$(dirname "$(dirname "$(which flutter)")")"
      - run: flutter pub get
      - run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  ui-test-android:
    name: UI Test (Maestro - Android)
    runs-on: [self-hosted, Linux, X64, astra, android]
    needs: [build]
    # This job requires an Android emulator or attached device on the runner.
    # If neither is available, the job is skipped.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Check for Android device
        id: check_device
        run: |
          if adb devices | grep -q "device$"; then
            echo "available=true" >> $GITHUB_OUTPUT
            echo "Android device available"
          else
            echo "available=false" >> $GITHUB_OUTPUT
            echo "No Android device — skipping UI tests"
          fi
      - name: Download APK
        if: steps.check_device.outputs.available == 'true'
        uses: actions/download-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/
      - name: Install Maestro
        if: steps.check_device.outputs.available == 'true'
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH
      - name: Install APK
        if: steps.check_device.outputs.available == 'true'
        run: adb install -r build/app/outputs/flutter-apk/app-debug.apk
      - name: Run Maestro UI tests
        if: steps.check_device.outputs.available == 'true'
        run: ~/.maestro/bin/maestro test .maestro/
