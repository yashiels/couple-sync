name: "Deploy: Backend Image (GHCR)"

# Builds the Fastify backend and publishes it to GHCR. Atlas (behind CGNAT) pulls this image via
# Watchtower — nothing is pushed INTO the homelab. See yashiels/homelab-config → atlas/couple-sync.
#
# Trigger is push-to-main / tags ONLY — never pull_request — so a fork PR can never publish. The
# job uses the built-in GITHUB_TOKEN (read-only for forks), so there is no long-lived secret here.
# The image bakes no secrets: config comes from runtime env on Atlas (see backend/src/config.ts).

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'backend/**'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

permissions:
  contents: read

# An image publish must not be interrupted mid-push, so overlapping runs serialize rather than
# cancel (see github-actions-conventions §6: serialize deploys/publishes).
concurrency:
  group: publish-backend-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/couple-sync-backend

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          # `latest` moves on every main push (what Watchtower follows); tags/sha give pinnable refs.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64          # Atlas is an Intel NUC — single arch keeps builds fast
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
