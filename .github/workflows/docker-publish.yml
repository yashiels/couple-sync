name: Publish backend image

# Builds the Fastify backend and publishes it to GHCR. Atlas (behind CGNAT) pulls this image via
# Watchtower — nothing is pushed INTO the homelab. See yashiels/homelab-config → atlas/couple-sync.
#
# Trigger is push-to-main / tags ONLY — never pull_request — so a fork PR can never publish. The
# job uses the built-in GITHUB_TOKEN (read-only for forks), so there is no long-lived secret here.
# The image bakes no secrets: config comes from runtime env on Atlas (see backend/src/config.ts).

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'backend/**'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

concurrency:
  group: publish-backend-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/couple-sync-backend

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # `latest` moves on every main push (what Watchtower follows); tags/sha give pinnable refs.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64          # Atlas is an Intel NUC — single arch keeps builds fast
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
