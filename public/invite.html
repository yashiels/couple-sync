<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Opening Couple Schedule…</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
  <p>Opening the app… If nothing happens, <a href="/">open Couple Schedule</a>.</p>
  <script>
    // Path looks like /invite/ABC123 -> extract the code, deep-link into the app.
    const parts = window.location.pathname.split('/');
    const code = parts[2] || '';
    if (code) {
      window.location.href = 'coupleschedule://invite/' + code;
    } else {
      window.location.href = '/';
    }
  </script>
</body>
</html>
