appId: ${APP_ID}
name: Bottom Navigation Tab Switching
---
- launchApp
- waitForAnimationToEnd
# Only run if we're on the main app (bottom nav visible)
- runFlow:
    when:
      visible: "Calendar"
    commands:
      - tapOn: "Calendar"
      - waitForAnimationToEnd
      - tapOn: "Overlap"
      - waitForAnimationToEnd
      - tapOn: "Settings"
      - waitForAnimationToEnd
      - tapOn: "Home"
      - waitForAnimationToEnd
      # Test back button — should return to Home tab, not exit app
      - tapOn: "Settings"
      - waitForAnimationToEnd
      - pressKey: Back
      - waitForAnimationToEnd
      # App should still be running
      - assertVisible: "Home"
