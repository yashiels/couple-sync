appId: com.skynergroup.couple_sync
name: Overlap Screen Renders Windows
---
- launchApp
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "Overlap"
    commands:
      - tapOn: "Overlap"
      - waitForAnimationToEnd
      # Either we see overlap windows or empty state
      - assertVisible:
          text: ".*overlap.*|.*window.*|.*free time.*"
