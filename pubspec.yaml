name: couple_schedule
description: Find mutual free time with your partner across timezones.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  go_router: ^15.1.2

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  firebase_messaging: ^15.1.3
  cloud_firestore: ^5.4.4

  # Google Calendar
  google_sign_in: ^6.2.1
  googleapis: ^13.1.0
  http: ^1.2.2

  # Apple / Device Calendar
  device_calendar: ^4.3.1

  # Local notifications
  flutter_local_notifications: ^18.0.1

  # State management
  flutter_riverpod: ^2.6.1

  # Persistence
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
